services:
  memgraph:
    image: memgraph/memgraph-mage:latest
    container_name: aml-memgraph
    ports:
      - "7687:7687"
    volumes:
      - memgraph_data:/var/lib/memgraph
    deploy:
      resources:
        limits:
          memory: 4G
    restart: unless-stopped

volumes:
  memgraph_data:
